// Wingbeats for a single-pose image: squash it flat and stretch it back. Tilted ones face their direction of flight.
function imageBat(name, src, width, flapHz, speed, tilted = false) {
  const img = new Image(); img.src = src;
  const draw = (ctx, f, b) => {
    if (!img.complete || !img.naturalWidth) return;
    const w = width / S, h = w * img.naturalHeight / img.naturalWidth, sy = 0.4 + 0.6 * (f + 1) / 2;
    ctx.save(); if (tilted && b.vx > 0) ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, -h * sy / 2, w, h * sy); ctx.restore();
  };
  return { name, draw, flapHz, speed, perches: false };
}
const ROUND_MIN = 10 * 60, ROUND_MAX = 20 * 60;  // a new round every 10-20 minutes
const LIFE_MIN = 4 * 60, LIFE_MAX = 9 * 60;      // how long each picked bat stays
const MAX_BATS = 3;
const MAX_FLYING = 2, MAX_RESTING = 2;           // never 3 flying at once, never 3 resting at once
// A bat heading to a perch is still in the air, and its perch is already taken, so it counts in both.
const FLYING = ['fly', 'leave', 'toPerch', 'exit'], RESTING = ['toPerch', 'hang', 'sleep'];

const rnd = (a, b) => a + Math.random() * (b - a);
let speed = 1, clock = 0, nextRound = 2, bats = [], lastPick = [];
const count = (states) => bats.filter(b => states.includes(b.state)).length;
const canFly = () => count(FLYING) < MAX_FLYING;
const canRest = () => count(RESTING) < MAX_RESTING;

// A round's set of bats (an empty round included) can't repeat either of the two sets before it.
const NO_REPEAT = 2;
let recentSets = [];
const setKey = (vs) => vs.map(v => v.name).sort().join(' + ') || 'no bats';

function startRound(forced) {
  const free = MAX_BATS - bats.length;
  const available = POOL.filter(v => !bats.some(b => b.v === v));
  let choices = null;
  for (let tries = 0; tries < 60 && !choices; tries++) {
    const n = Math.min(free, available.length, forced ?? Math.floor(Math.random() * (MAX_BATS + 1)));  // 0, 1, 2 or 3
    const pick = [...available].sort(() => Math.random() - 0.5).slice(0, n);
    if (!recentSets.includes(setKey(pick))) choices = pick;
  }
  if (!choices) { nextRound = clock + 60; return; }  // last round's bats still around: try again in a minute
  for (const v of choices) bats.push(newBat(v));
  lastPick = choices.map(v => v.name);
  recentSets = [setKey(choices), ...recentSets].slice(0, NO_REPEAT);
  nextRound = clock + rnd(ROUND_MIN, ROUND_MAX);
}

// New bats wait just off screen and fly in one by one, as soon as the flying limit allows.
function newBat(v) {
  return { v, state: 'away', x: -100, y: 200, vx: 0, vy: 0, t: rnd(0, 10), timer: rnd(0, 4), life: rnd(LIFE_MIN, LIFE_MAX), perch: null, cross: false };
}

// Flying targets live in the side strips. Now and then (or when asked) the bat crosses to the other side.
function pickTarget(b, otherSide) {
  const onLeft = b.x < W / 2;
  const goLeft = otherSide ? !onLeft : (b.x < 0 ? true : b.x > W ? false : onLeft);
  b.tx = goLeft ? rnd(30, CX0 - 40) : rnd(CX1 + 40, W - 30);
  b.ty = rnd(40, 470);                            // stays above the sign and the logo
  b.cross = goLeft !== onLeft && b.x >= 0 && b.x <= W;
}

function steer(b, dt, arrive) {
  const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy) || 1;
  let sp = b.v.speed;
  if (b.x > CX0 && b.x < CX1) sp *= 1.5;          // over the nail photo: hurry across
  if (arrive && d < 140) sp *= Math.max(0.15, d / 140);
  const k = Math.min(1, dt * 2.2);
  b.vx += (dx / d * sp - b.vx) * k; b.vy += (dy / d * sp - b.vy) * k;
  b.x += b.vx * dt; b.y += b.vy * dt;
  return d;
}

function freePerch() {
  const open = PERCHES.filter(p => !p.owner);
  return open.length ? open[Math.floor(Math.random() * open.length)] : null;
}
function release(b) { if (b.perch) { b.perch.owner = null; b.perch = null; } }

function update(b, dt) {
  b.t += dt; b.timer -= dt; b.life -= dt;
  if (b.life <= 0 && b.state !== 'exit' && b.state !== 'gone') {
    if (b.state === 'away') { b.state = 'gone'; return; }
    const perched = b.state === 'hang' || b.state === 'sleep';
    if (!perched || canFly()) {                    // a perched bat waits for room in the air before it leaves
      release(b); b.state = 'exit'; b.tx = b.x < W / 2 ? -120 : W + 120; b.ty = rnd(60, 300);
      if (perched) b.vy = 140;                     // drop off the perch, then fly away
    }
  }
  switch (b.state) {
    case 'fly':
      if (steer(b, dt) < 40) pickTarget(b, Math.random() < 0.025);  // now and then crosses over the photo to the other side
      if (b.timer <= 0) {
        const r = Math.random(), spot = b.v.perches && canRest() ? freePerch() : null;
        if (spot && r < 0.45) { b.perch = spot; spot.owner = b; b.tx = spot.x; b.ty = spot.y; b.state = 'toPerch'; }
        else if (r < 0.75) { b.tx = b.x < W / 2 ? -120 : W + 120; b.ty = rnd(60, 400); b.state = 'leave'; }
        else b.timer = rnd(10, 20);
      }
      break;
    case 'leave': if (steer(b, dt) < 30) { b.state = 'away'; b.timer = rnd(8, 25); } break;
    case 'away':
      if (b.timer <= 0) {
        if (!canFly()) { b.timer = rnd(3, 8); break; }  // two already flying: try again shortly
        const l = Math.random() < 0.5; b.x = l ? -100 : W + 100; b.y = rnd(60, 380); pickTarget(b, false); b.state = 'fly'; b.timer = rnd(15, 30);
      }
      break;
    case 'toPerch': if (steer(b, dt, true) < 4) { b.x = b.perch.x; b.y = b.perch.y; b.vx = b.vy = 0; b.state = 'hang'; b.timer = rnd(6, 14); } break;
    case 'hang': if (b.timer <= 0) { b.state = 'sleep'; b.timer = rnd(25, 70); } break;
    case 'sleep':
      if (b.timer <= 0 && !canFly()) b.timer = rnd(5, 12);  // two already flying: sleep a little longer
      else if (b.timer <= 0) { release(b); b.state = 'fly'; b.vy = 140; b.vx = b.x < W / 2 ? 80 : -80; pickTarget(b, Math.random() < 0.15); b.timer = rnd(15, 30); }
      break;
    case 'exit': if (steer(b, dt) < 40) b.state = 'gone'; break;
  }
}

function flapOf(b) {
  if (b.v.glide) { const c = b.t % 2.6; if (c > 1.0) return 0.15 + Math.sin(b.t * 2) * 0.05; }
  return Math.sin(b.t * Math.PI * 2 * b.v.flapHz);
}
function wing(ctx, side, pts) {
  ctx.beginPath(); ctx.moveTo(side * pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) { const p = pts[i]; if (p.length === 4) ctx.quadraticCurveTo(side * p[0], p[1], side * p[2], p[3]); else ctx.lineTo(side * p[0], p[1]); }
  ctx.closePath(); ctx.fill();
}
function classicBody(ctx) {
  ctx.beginPath(); ctx.ellipse(0, 1, 4.5, 7.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -9); ctx.lineTo(-3.5, -16); ctx.lineTo(-0.8, -11); ctx.moveTo(4, -9); ctx.lineTo(3.5, -16); ctx.lineTo(0.8, -11); ctx.fill();
}
function classicBat(ctx, f) {
  ctx.fillStyle = '#0d0b0a'; const up = -f * 11;
  for (const s of [1, -1]) wing(ctx, s, [[3, -4], [15, -12 + up * 0.8], [30, -7 + up], [24, 1 + up * 0.5, 21, 3 + up * 0.35], [17, 1 + up * 0.2, 13, 5], [8, 3, 3, 5]]);
  classicBody(ctx);
}
function eyesBat(ctx, f) { classicBat(ctx, f); ctx.fillStyle = '#ff9a1f'; ctx.beginPath(); ctx.arc(-1.7, -8.5, 1.2, 0, 7); ctx.arc(1.7, -8.5, 1.2, 0, 7); ctx.fill(); }
function cuteBat(ctx, f) {
  ctx.fillStyle = '#0d0b0a';
  for (const s of [1, -1]) { ctx.save(); ctx.translate(s * 7, -1); ctx.rotate(s * (-0.2 - f * 0.55)); ctx.beginPath(); ctx.ellipse(s * 10, 0, 12, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-7, -15); ctx.lineTo(-2, -8); ctx.moveTo(8, -4); ctx.lineTo(7, -15); ctx.lineTo(2, -8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, -1.5, 1.8, 0, 7); ctx.arc(3, -1.5, 1.8, 0, 7); ctx.fill();
}
function gothicBat(ctx, f) {
  ctx.fillStyle = '#0d0b0a'; const up = -f * 14;
  for (const s of [1, -1]) wing(ctx, s, [[3, -3], [18, -14 + up * 0.7], [44, -10 + up], [34, -2 + up * 0.5, 31, 2 + up * 0.4], [27, -1 + up * 0.25, 22, 3 + up * 0.2], [17, 1, 13, 4], [8, 2, 3, 5]]);
  ctx.beginPath(); ctx.ellipse(0, 1, 3.5, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -8, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3, -9); ctx.lineTo(-3.5, -17); ctx.lineTo(-0.5, -11); ctx.moveTo(3, -9); ctx.lineTo(3.5, -17); ctx.lineTo(0.5, -11); ctx.fill();
}

// Hanging upside down, wings wrapped. The only motion is a slow sway on one sine wave, so the loop is seamless.
function hanging(ctx, b, asleep) {
  const cute = b.v.draw === cuteBat;
  ctx.fillStyle = '#0d0b0a'; ctx.strokeStyle = '#0d0b0a'; ctx.lineWidth = 1.4;
  ctx.rotate(Math.sin(b.t * 1.3) * 0.06);
  ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-2.5, 5); ctx.moveTo(2, 0); ctx.lineTo(2.5, 5); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 15, cute ? 9 : 7, cute ? 11 : 12, 0, 0, Math.PI * 2); ctx.fill();
  const hy = cute ? 26 : 28;
  ctx.beginPath(); ctx.arc(0, hy, cute ? 6 : 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3.5, hy + 1); ctx.lineTo(-3.5, hy + 8); ctx.lineTo(-0.8, hy + 3); ctx.moveTo(3.5, hy + 1); ctx.lineTo(3.5, hy + 8); ctx.lineTo(0.8, hy + 3); ctx.fill();
  if (!asleep) {
    const c = b.v.draw === eyesBat ? '#ff9a1f' : cute ? '#fff' : null;
    if (c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-1.7, hy + 0.5, 1.1, 0, 7); ctx.arc(1.7, hy + 0.5, 1.1, 0, 7); ctx.fill(); }
  }
}
function zzz(ctx, b) {
  ctx.fillStyle = '#efe8dc';
  for (let i = 0; i < 3; i++) {
    const p = ((b.t * 0.45) + i / 3) % 1;
    ctx.globalAlpha = Math.sin(p * Math.PI) * 0.9; ctx.font = `600 ${(9 + p * 9) * S}px system-ui`;
    ctx.fillText('z', b.x + (10 + p * 18) * S, b.y + (30 - p * 34) * S);
  }
  ctx.globalAlpha = 1;
}

const LABEL = { fly: 'flying', leave: 'flying off', away: 'off screen', toPerch: 'landing', hang: 'resting', sleep: 'sleeping', exit: 'leaving for good' };
const ctx = document.getElementById('c').getContext('2d'), status = document.getElementById('status');
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
document.querySelectorAll('[data-speed]').forEach(btn => btn.onclick = () => {
  speed = +btn.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
});
document.getElementById('now').onclick = () => { nextRound = clock; };
document.getElementById('three').onclick = () => { for (const b of bats) { if (b.state !== 'away') release(b); b.state = 'gone'; } bats = []; startRound(3); };
let broken = 0;

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000) * speed; last = now;
  while (dt > 0) {                                  // fixed small steps so high speeds stay smooth
    const step = Math.min(dt, 0.05); dt -= step; clock += step;
    if (clock >= nextRound) startRound();
    for (const b of bats) update(b, step);
    bats = bats.filter(b => b.state !== 'gone');
    if (count(FLYING) > MAX_FLYING || count(['hang', 'sleep']) > MAX_RESTING) broken++;
  }
  ctx.drawImage(BG, 0, 0, W, H);
  for (const b of bats) {
    if (b.state === 'away') continue;
    ctx.save(); ctx.translate(b.x, b.y);
    if (b.state === 'hang' || b.state === 'sleep') { ctx.scale(S, S); hanging(ctx, b, b.state === 'sleep'); ctx.restore(); if (b.state === 'sleep') zzz(ctx, b); continue; }
    ctx.translate(0, Math.sin(b.t * 3) * 5); ctx.scale(S, S); ctx.rotate(Math.max(-0.35, Math.min(0.35, b.vx / 1200)));
    b.v.draw(ctx, flapOf(b), b); ctx.restore();
  }
  const fly = count(FLYING), rest = count(['hang', 'sleep']);
  status.innerHTML = `<div>Next round in <b>${fmt(Math.max(0, nextRound - clock))}</b> · last round picked ${lastPick.length ? lastPick.join(', ') : 'no bats'}</div>` +
    `<div class="row">Can't be picked next: ${recentSets.length ? recentSets.join('  ·  ') : 'nothing yet'}</div>` +
    `<div>Flying now <b>${fly}</b> of max ${MAX_FLYING} · resting now <b>${rest}</b> of max ${MAX_RESTING}` +
    (broken ? ` · <b style="color:#ff6b6b">rule broken ${broken}×</b>` : ' · rules held') + `</div>` +
    (bats.length ? bats.map(b => `<div class="row">${b.v.name}: ${LABEL[b.state]} · stays ${fmt(Math.max(0, b.life))} more</div>`).join('') : '<div class="row">No bats on screen</div>');
  requestAnimationFrame(frame);
}
BG.onload = () => requestAnimationFrame(frame);
</script>
</body>
</html>
