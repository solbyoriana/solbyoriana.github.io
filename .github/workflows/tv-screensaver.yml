name: Build TV screensaver

on:
  push:
    branches: [main]
    paths:
      - 'tv/screensaver/**'
      - '.github/workflows/tv-screensaver.yml'
  workflow_dispatch:         # the "Run workflow" button = build again

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed app
        env:
          SOL_KEYSTORE_B64: ${{ secrets.SOL_KEYSTORE }}
          SOL_KEYSTORE_PASS: ${{ secrets.SOL_KEYSTORE_PASS }}
        run: |
          echo "$SOL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sol.p12"
          export SOL_KEYSTORE_FILE="$RUNNER_TEMP/sol.p12"
          gradle -p tv/screensaver assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/sol.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: sol-screensaver
          path: tv/screensaver/build/outputs/apk/release/*.apk
          retention-days: 30
