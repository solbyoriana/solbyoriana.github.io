    <div class="mini-inner">
      <button class="lang-toggle" type="button" tabindex="-1" aria-label="Switch language">EN</button>
      <a class="mini-logo" href="#top" tabindex="-1" aria-label="SOL by Oriana"><img src="assets/logo.png" width="900" height="503" alt=""></a>
      <nav class="socials" aria-label="Social">
        <a href="https://www.instagram.com/solbyoriana/" target="_blank" rel="noopener" tabindex="-1" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" class="fill"/></svg>
        </a>
        <a href="https://www.tiktok.com/@solbyoriana" target="_blank" rel="noopener" tabindex="-1" aria-label="TikTok">

        </a>
      </nav>
    </div>
  </div>

  <header class="hero" id="top">
    <div class="topbar">
      <button class="lang-toggle" type="button" aria-label="Switch language">EN</button>
      <nav class="socials" aria-label="Social">
        <a href="https://www.instagram.com/solbyoriana/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" class="fill"/></svg>
        </a>
        <a href="https://www.tiktok.com/@solbyoriana" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.7"/></svg>
        </a>
      </nav>
    </div>
    <h1 class="logo" id="logo"><img src="assets/logo.png" width="900" height="503" alt="SOL — Nail &amp; Beauty Artist — by Oriana"></h1>
    <p class="intro" data-i18n="intro"></p>
    <p class="meta-line">
      <span id="heroCount"></span>
      <span class="dot" aria-hidden="true">·</span>
      <span data-i18n="location"></span>
      <span class="dot" aria-hidden="true">·</span>
      <a href="https://www.instagram.com/solbyoriana/" target="_blank" rel="noopener" dir="ltr">@solbyoriana</a>
    </p>
  </header>

  <main>
    <section class="work" id="work" aria-labelledby="workTitle">
      <div class="work-head">
        <h2 class="work-title" id="workTitle" data-i18n="workTitle"></h2>
        <div class="filters" id="filters" role="tablist"></div>
      </div>
      <div class="sample-note" id="sampleNote" hidden data-i18n="sampleNote"></div>
      <div class="grid" id="grid" aria-live="polite"></div>
      <p class="empty" id="empty" hidden data-i18n="empty"></p>
    </section>
  </main>

  <footer class="contact" id="contact">
    <div class="contact-inner">
      <h2 class="contact-title" data-i18n="contactTitle"></h2>
      <p class="contact-text" data-i18n="contactText"></p>
      <a class="wa-button" id="waButton" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-3.6A8 8 0 1 1 8 19.1L4 20z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2L9.4 8z" class="fill"/></svg>
        <span data-i18n="contact"></span>
      </a>
      <ul class="contact-links">
        <li>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>

        <li><a href="https://www.instagram.com/solbyoriana/" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="https://www.tiktok.com/@solbyoriana" target="_blank" rel="noopener">TikTok</a></li>
      </ul>
      <p class="copyright">© <span id="year"></span> SOL by Oriana</p>
    </div>
  </footer>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.2-3.6A8 8 0 1 1 8 19.1L4 20z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2L9.4 8z" class="fill"/></svg>
  </a>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="SOL">
    <div class="lb-top">
      <span class="lb-counter" id="lbCounter"></span>
      <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="lb-btn lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-btn lb-nav lb-next" id="lbNext" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lb-info">
      <div class="lb-dots" id="lbDots"></div>
      <p class="lb-date" id="lbDate"></p>
      <p class="lb-caption" id="lbCaption" dir="auto"></p>
      <a class="lb-link" id="lbLink" href="#" target="_blank" rel="noopener" data-i18n="viewOnInstagram"></a>
    </div>
  </div>

  <script src="js/i18n.js?v=__V__"></script>
  <script src="js/app.js?v=__V__"></script>
