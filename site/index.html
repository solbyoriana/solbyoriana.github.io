      <div class="end-group"><button class="menu-btn" type="button" tabindex="-1" aria-controls="menuPanel" aria-expanded="false" data-i18n-label="menuOpen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="socials" aria-label="Social">

        <h2 class="section-title" id="aboutTitle" data-i18n="aboutTitle"></h2>
        <div class="about-body" id="aboutBody"></div>
      </div>
